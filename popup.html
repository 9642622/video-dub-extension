<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { width: 260px; margin: 0; padding: 14px;
           font: 13px/1.45 -apple-system, sans-serif; background: #fff; color: #1a1a1a; }
    h4 { margin: 0 0 10px; font-size: 13px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px;
             background: #1a73e8; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 10px; min-height: 16px; font-size: 12px; color: #b26a00; }
    a { display: inline-block; margin-top: 10px; font-size: 12px; color: #1a73e8; }
    .hint { margin-top: 10px; font-size: 11.5px; color: #666; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      .hint { color: #9aa0a6; }
      #status { color: #ffd54f; }
    }
  </style>
</head>
<body>
  <h4>Перевод видео</h4>
  <button id="panel">Открыть панель перевода</button>
  <div id="status"></div>
  <div class="hint">Панель откроется справа на странице с видео.
    Дальше — «Перевести это видео».</div>
  <a href="#" id="opts">Настройки: ключи и голоса</a>
  <script src="popup.js"></script>
</body>
</html>
